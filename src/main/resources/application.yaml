spring:
  application:
    name: media-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/media"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto

internal:
  service:
    # the household profiles: the member who presses the button of the amplifier must hold amplifier_unlock (HAS-515)
    database: http://database-service:6200

media:
  # the amplifier of the house (HAS-515). The address is its host on the LAN, from the manifest of deployment-tools - no
  # default and never in this public repository; cholewa.required-properties refuses the start without it. The timeout
  # waits for the connection and for the answer (a bare number is seconds, 1 - 30 s)
  amplifier:
    address: ${amplifier-address}
    timeout: PT5S

cholewa:
  # refuses the start before the first bean when one of these has no value (cholewa-commons >= 1.9.0)
  required-properties:
    - property: media.amplifier.address
      variable: amplifier-address

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform — and kept in the shared
      # document, where the paths can be exercised locally on 8018 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local

internal:
  service:
    database: http://localhost:6005

server:
  port: 6018
management:
  server:
    port: 8018

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
---

spring:
  config:
    activate:
      on-profile: test

# a context test reaches nothing of the house: both at an address nothing listens on
internal:
  service:
    database: http://localhost:1

media:
  amplifier:
    address: localhost:1

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
